<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Глубокое тестирование личности</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: 'Inter', sans-serif;
      color: #102a43; /* тёмно-синий */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      max-width: 90%;
      font-weight: 600;
      margin: 0;
    }
    .arrow {
      font-size: 3rem;
      color: #8b0000; /* бордовый */
      margin-top: 30px;
      animation: bounce 2s infinite;
      user-select: none;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(10px);
      }
    }
  </style>
</head>
<body>
  <h1>Глубокое личностное тестирование<br>на основе современных научных подходов</h1>
  <div class="arrow">⌵</div>
</body>
</html>
